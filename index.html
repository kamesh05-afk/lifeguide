<script>
const G=[
{id:'phone',cat:'digital',icon:'📱',tag:['Digital safety','டிஜிட்டல் பாதுகாப்பு'],en:{title:'Lost or stolen phone',desc:'Protect your SIM, accounts and device.',steps:['Use another trusted device to locate or secure your phone through the maker’s official service, if enabled.','Contact your mobile operator to block the SIM and ask about replacement.','Change your main email and important account passwords; sign out other sessions where possible.','If theft is suspected, report it to local police. In India, check the official CEIR portal: https://www.ceir.gov.in/.'],warn:'Never share OTPs, passwords, PINs or recovery codes.'},ta:{title:'தொலைந்த அல்லது திருடப்பட்ட கைப்பேசி',desc:'சிம், கணக்குகள் மற்றும் சாதனத்தைப் பாதுகாக்கவும்.',steps:['மற்றொரு நம்பகமான சாதனத்தில், இயக்கப்பட்டிருந்தால், தயாரிப்பாளரின் அதிகாரப்பூர்வ சேவையைப் பயன்படுத்திக் கைப்பேசியைக் கண்டறியவும்.','மொபைல் நிறுவனத்தைத் தொடர்புகொண்டு சிம் கார்டைத் தடுக்கவும்.','முக்கிய மின்னஞ்சல் மற்றும் கணக்குகளின் கடவுச்சொற்களை மாற்றவும்.','திருட்டு எனச் சந்தேகித்தால் காவல்துறையில் புகார் அளிக்கவும். இந்தியாவில் அதிகாரப்பூர்வ CEIR தளம்: https://www.ceir.gov.in/.'],warn:'OTP, கடவுச்சொல், PIN அல்லது மீட்புக் குறியீடுகளைப் பகிர வேண்டாம்.'}},
{id:'money',cat:'digital',icon:'💳',tag:['Money & scams','பணம் மற்றும் மோசடி'],en:{title:'Wrong transfer or payment scam',desc:'Act quickly and keep transaction evidence.',steps:['Contact your bank or payment app through its official support channel immediately.','Save the transaction ID, date, amount and screenshots privately.','Ask the provider to register a complaint and explain next steps.','If you suspect financial cyber fraud in India, report it at https://www.cybercrime.gov.in/ or call 1930.'],warn:'Never share your UPI PIN or OTP. Do not pay strangers promising to recover money.'},ta:{title:'தவறான பணப் பரிமாற்றம் அல்லது மோசடி',desc:'உடனே செயல்பட்டு ஆதாரங்களைப் பாதுகாக்கவும்.',steps:['வங்கி அல்லது பணப்பரிவர்த்தனை செயலியின் அதிகாரப்பூர்வ வழியில் உடனே தொடர்புகொள்ளவும்.','பரிவர்த்தனை எண், தேதி, தொகை மற்றும் திரைப்பிடிப்புகளைத் தனிப்பட்ட முறையில் வைத்திருங்கள்.','புகாரைப் பதிவு செய்து அடுத்த படிகளைக் கேளுங்கள்.','இந்தியாவில் இணைய நிதி மோசடி சந்தேகம் இருந்தால் https://www.cybercrime.gov.in/ தளத்தில் புகாரளிக்கவும் அல்லது 1930-ஐ அழைக்கவும்.'],warn:'UPI PIN அல்லது OTP-ஐ பகிர வேண்டாம். பணத்தை மீட்டுத் தருவதாகக் கூறும் அந்நியருக்குப் பணம் செலுத்த வேண்டாம்.'}},
{id:'documents',cat:'documents',icon:'📄',tag:['Documents','ஆவணங்கள்'],en:{title:'Lost certificates or ID documents',desc:'Reduce misuse risk and find the official replacement process.',steps:['List what was lost and when/where you last saw it.','If theft or identity misuse is possible, report it to local police and keep the reference number.','Use the issuing authority’s official website to learn how to request a replacement.','If a bank card was lost, contact the issuing provider promptly.'],warn:'Do not upload full identity documents to unknown websites.'},ta:{title:'தொலைந்த சான்றிதழ்கள் அல்லது அடையாள ஆவணங்கள்',desc:'தவறான பயன்பாட்டைத் தடுத்து, அதிகாரப்பூர்வ மாற்று முறையைப் பின்பற்றவும்.',steps:['எந்த ஆவணம், எப்போது, எங்கு தொலைந்தது என்பதைப் பதிவு செய்யவும்.','திருட்டு சந்தேகமிருந்தால் காவல்துறையில் புகார் அளித்து குறிப்பு எண்ணை வைத்திருங்கள்.','மாற்று ஆவணத்திற்கான முறையை அதிகாரப்பூர்வ தளத்தில் பார்க்கவும்.','வங்கி அட்டை தொலைந்தால் சம்பந்தப்பட்ட வங்கியை உடனே தொடர்புகொள்ளவும்.'],warn:'அறியாத இணையதளங்களில் முழு அடையாள ஆவணங்களைப் பதிவேற்ற வேண்டாம்.'}},
{id:'laptop',cat:'study',icon:'💻',tag:['Study & work','படிப்பு மற்றும் வேலை'],en:{title:'Laptop or internet problem',desc:'Try safe basic checks before making changes.',steps:['Check the charger, cable and socket; do not use damaged equipment.','If frozen, wait briefly and try a normal restart when safe. Save work first if possible.','For internet trouble, check Wi-Fi and try an approved backup connection.','Contact your college IT support if the problem continues.'],warn:'Avoid unknown repair apps or opening the laptop casing if unsure.'},ta:{title:'மடிக்கணினி அல்லது இணையப் பிரச்சினை',desc:'பாதுகாப்பான அடிப்படைச் சோதனைகளை முயற்சிக்கவும்.',steps:['சார்ஜர், கேபிள் மற்றும் மின்சார இணைப்பைச் சரிபார்க்கவும்.','உறைந்திருந்தால் சிறிது காத்திருந்து பாதுகாப்பாக இருந்தால் மறுதொடக்கம் செய்யவும்.','இணையப் பிரச்சினை என்றால் Wi-Fi-ஐச் சரிபார்க்கவும்.','பிரச்சினை தொடர்ந்தால் கல்லூரி IT உதவியைத் தொடர்புகொள்ளவும்.'],warn:'தெரியாத repair செயலிகளை நிறுவாதீர்கள்.'}},
{id:'exam',cat:'study',icon:'🎓',tag:['Study & work','படிப்பு மற்றும் வேலை'],en:{title:'Exam-day problem',desc:'Make a calm plan and contact the right person early.',steps:['Check the official exam notice for time, venue and permitted items.','If delayed, unwell or missing an item, contact the exam office or invigilator promptly.','Keep relevant documents ready and protect private information.','Follow your institution’s official process for reporting an emergency.'],warn:'Verify exam rules with your institution.'},ta:{title:'தேர்வு நாளில் பிரச்சினை',desc:'அமைதியாக இருந்து சரியான அதிகாரியைத் தொடர்புகொள்ளவும்.',steps:['தேர்வு நேரம், இடம், அனுமதிக்கப்பட்ட பொருட்களை அறிவிப்பில் சரிபார்க்கவும்.','தாமதம் அல்லது உடல்நலக் குறைவு ஏற்பட்டால் தேர்வு அலுவலகத்தை உடனே தொடர்புகொள்ளவும்.','தேவையான ஆவணங்களைத் தயார் வைத்திருந்து தனிப்பட்ட தகவல்களைப் பாதுகாக்கவும்.','கல்வி நிறுவனம் கூறும் அதிகாரப்பூர்வ முறையைப் பின்பற்றவும்.'],warn:'தேர்வு விதிகளை கல்வி நிறுவனத்திடம் உறுதிப்படுத்தவும்.'}},
{id:'emergency',cat:'safety',icon:'🚨',tag:['Immediate safety','உடனடி பாதுகாப்பு'],en:{title:'Someone may be in immediate danger',desc:'Get local emergency help first.',steps:['Move to a safer place if you can do so without risk.','Call local emergency services and state your location, what happened and whether anyone is injured.','Follow the dispatcher’s instructions; do not put yourself in danger.','If safe, stay nearby until trained help arrives.'],warn:'In India, 112 is the national emergency response number.'},ta:{title:'யாருக்காவது உடனடி ஆபத்து',desc:'முதலில் உள்ளூர் அவசர உதவியை அழைக்கவும்.',steps:['உங்களுக்கு ஆபத்து ஏற்படாமல் பாதுகாப்பான இடத்திற்குச் செல்லவும்.','அவசர உதவியை அழைத்து இடம், நடந்தது, காயமடைந்தவர்கள் உள்ளனரா என்பதைத் தெரிவிக்கவும்.','அவசர உதவி மையத்தின் வழிமுறைகளைப் பின்பற்றவும்.','பாதுகாப்பாக இருந்தால் உதவி வரும் வரை அருகில் இருங்கள்.'],warn:'இந்தியாவில் தேசிய அவசர உதவி எண் 112.'}},
{id:'travel',cat:'safety',icon:'🧳',tag:['Travel','பயணம்'],en:{title:'Travel disruption or lost belongings',desc:'Stay safe and use official help desks.',steps:['Move to a safe, staffed place such as an official help desk.','Contact the transport operator through its official app, website or counter.','If belongings were stolen, report it to local police.','Tell a trusted person your situation if you need support.'],warn:'Do not follow strangers to isolated places or share live location publicly.'},ta:{title:'பயணத் தடங்கல் அல்லது தொலைந்த பொருட்கள்',desc:'பாதுகாப்பான இடத்தில் இருந்து அதிகாரப்பூர்வ உதவியைப் பெறவும்.',steps:['அதிகாரப்பூர்வ உதவி மையம் போன்ற பாதுகாப்பான இடத்திற்குச் செல்லவும்.','போக்குவரத்து நிறுவனத்தின் அதிகாரப்பூர்வ வழியில் தொடர்புகொள்ளவும்.','பொருட்கள் திருடப்பட்டால் காவல்துறையில் புகார் அளிக்கவும்.','உதவி தேவைப்பட்டால் நம்பகமான ஒருவரிடம் தெரிவிக்கவும்.'],warn:'அந்நியருடன் தனிமையான இடத்திற்குச் செல்ல வேண்டாம்.'}}
];
const T={en:{pill:'Practical help, in simple words',eyebrow:'A little help when you need it',hero:'When life gets complicated, start here.',desc:'Simple, step-by-step guides for everyday emergencies and unexpected problems. Find a safe next step without the confusion.',browse:'Explore guides ↓',ask:'Ask LifeGuide ✨',safetyTitle:'If someone is in immediate danger',safetyText:'Contact local emergency services first. In India, call 112. This website provides general guidance and is not an emergency service.',guideTitle:'Find a guide',guideSubtitle:'Choose a topic or search for your situation.',all:'All topics',digital:'Digital & money',documents:'Documents',study:'Study & work',safety:'Safety',search:'Try “phone”, “money”, or “exam”…',view:'View steps',hide:'Hide steps',empty:'No guides match that search. Try another word.',assistantTitle:'✨ Ask LifeGuide',assistantDesc:'Describe what happened and we’ll look for a relevant guide on this page. This starter version works without an AI API and does not send your question to a server.',question:'What happened? e.g. I lost my phone',submit:'Find guidance',voice:'🎤 Voice',note:'Privacy tip: Don’t enter passwords, OTPs, bank details, or full identity numbers. This is a guide finder, not a real AI chatbot yet.',footer:'Clear guidance. Safer next steps.',privacy:'Privacy first · Check official sources · General information only',caution:'Caution:'},ta:{pill:'எளிய சொற்களில் நடைமுறை உதவி',eyebrow:'தேவைப்படும் நேரத்தில் சிறிய உதவி',hero:'சிக்கல் ஏற்பட்டால், இங்கிருந்து தொடங்குங்கள்.',desc:'அன்றாட அவசரநிலைகள் மற்றும் எதிர்பாராத பிரச்சினைகளுக்கான எளிய படிப்படியான வழிகாட்டிகள்.',browse:'வழிகாட்டிகளைப் பார்க்க ↓',ask:'LifeGuide-ஐ கேளுங்கள் ✨',safetyTitle:'யாருக்காவது உடனடி ஆபத்து என்றால்',safetyText:'முதலில் உள்ளூர் அவசர சேவையைத் தொடர்புகொள்ளவும். இந்தியாவில் 112-ஐ அழைக்கவும். இது பொதுவான வழிகாட்டி மட்டுமே.',guideTitle:'வழிகாட்டியைத் தேர்வு செய்யவும்',guideSubtitle:'தலைப்பைத் தேர்வு செய்யவும் அல்லது உங்கள் பிரச்சினையைத் தேடவும்.',all:'அனைத்தும்',digital:'டிஜிட்டல் மற்றும் பணம்',documents:'ஆவணங்கள்',study:'படிப்பு மற்றும் வேலை',safety:'பாதுகாப்பு',search:'“கைப்பேசி”, “பணம்” அல்லது “தேர்வு” எனத் தேடவும்…',view:'வழிமுறைகளைப் பார்க்க',hide:'மறைக்க',empty:'பொருத்தமான வழிகாட்டி இல்லை. வேறு சொல்லை முயற்சிக்கவும்.',assistantTitle:'✨ LifeGuide-ஐ கேளுங்கள்',assistantDesc:'என்ன நடந்தது என்று எழுதுங்கள்; இந்தப் பக்கத்தில் உள்ள பொருத்தமான வழிகாட்டியைத் தேடுகிறோம். இது AI API இன்றி இயங்குகிறது; உங்கள் கேள்வியை சேவையகத்திற்கு அனுப்பாது.',question:'என்ன நடந்தது? உதா: கைப்பேசி தொலைந்தது',submit:'வழிகாட்டியைத் தேடு',voice:'🎤 குரல்',note:'கடவுச்சொல், OTP, வங்கி விவரம் அல்லது முழு அடையாள எண்ணை உள்ளிட வேண்டாம். இது வழிகாட்டித் தேடல் மட்டுமே; உண்மையான AI chatbot இன்னும் இல்லை.',footer:'தெளிவான வழிகாட்டி. பாதுகாப்பான அடுத்த படி.',privacy:'தனியுரிமை · அதிகாரப்பூர்வ ஆதாரங்களைச் சரிபார்க்கவும் · பொதுத் தகவல் மட்டுமே',caution:'கவனம்:'}};
let lang='en';const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function linkify(s){return esc(s).replace(/(https:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');}
function render(){const t=T[lang],q=$('search').value.trim().toLocaleLowerCase(),cat=$('category').value;document.documentElement.lang=lang;
const ids={pill:'pill',eyebrow:'eyebrow',hero:'hero-title',desc:'hero-desc',browse:'browse',ask:'ask',safetyTitle:'safety-title',safetyText:'safety-text',guideTitle:'guide-title',guideSubtitle:'guide-subtitle',assistantTitle:'assistant-title',assistantDesc:'assistant-desc',submit:'ask-submit',voice:'voice-btn',note:'note',footer:'footer-text',privacy:'privacy'};
for(const [k,id] of Object.entries(ids))$(id).textContent=t[k];$('search').placeholder=t.search;$('question').placeholder=t.question;
['all','digital','documents','study','safety'].forEach((k,i)=>$('category').options[i].text=t[k]);
const cards=$('cards');cards.innerHTML='';let n=0;G.filter(g=>cat==='all'||g.cat===cat).forEach(g=>{const d=lang==='ta'?g.ta:g.en;if(!(d.title+' '+d.desc+' '+g.en.title+' '+(g.ta?.title||'')).toLocaleLowerCase().includes(q))return;n++;
const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="icon">${g.icon}</div><span class="tag">${g.tag[lang==='ta'?1:0]}</span><h3>${d.title}</h3><p>${d.desc}</p><button class="btn light">${t.view}</button><div class="details"><ol>${d.steps.map(s=>`<li>${linkify(s)}</li>`).join('')}</ol><div class="warning"><strong>${t.caution}</strong> ${d.warn}</div></div>`;
const b=c.querySelector('button'),det=c.querySelector('.details');b.onclick=()=>{det.classList.toggle('show');b.textContent=det.classList.contains('show')?t.hide:t.view};cards.appendChild(c)});$('empty').style.display=n?'none':'block';$('empty').textContent=t.empty;}
$('language').onchange=e=>{lang=e.target.value;render();$('answer').classList.remove('show')};$('search').oninput=render;$('category').onchange=render;
function findGuide(){const q=$('question').value.trim().toLocaleLowerCase(),t=T[lang],out=$('answer');if(!q){out.textContent=lang==='ta'?'முதலில் உங்கள் பிரச்சினையை எழுதுங்கள்.':'Please describe your problem first.';out.classList.add('show');return}
const keys=[['phone',['phone','mobile','stolen','lost phone','கைப்பேசி','மொபைல்','திருட','தொலைந்த']],['money',['money','transfer','payment','upi','scam','fraud','bank','பணம்','வங்கி','மோசடி','பரிமாற்றம்']],['documents',['document','certificate','id card','passport','ஆவணம்','சான்றிதழ்','அடையாள அட்டை']],['laptop',['laptop','computer','internet','wifi','கணினி','மடிக்கணினி','இணையம்']],['exam',['exam','college','test','study','தேர்வு','கல்லூரி','படிப்பு']],['emergency',['danger','emergency','injured','hurt','unsafe','ஆபத்து','அவசரம்','காயம்']],['travel',['travel','train','bus','journey','பயணம்','ரயில்','பேருந்து']]];
const match=keys.find(([id,words])=>words.some(w=>q.includes(w)));if(match){const g=G.find(x=>x.id===match[0]),d=lang==='ta'?g.ta:g.en;out.textContent=d.title+'\n\n'+d.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')+'\n\n'+(lang==='ta'?'கவனம்: ':'Caution: ')+d.warn+'\n\n'+(lang==='ta'?'இது பொதுவான வழிகாட்டி மட்டுமே.':'This is general guidance only.');$('search').value=lang==='ta'?d.title:g.en.title;render()}else{out.textContent=lang==='ta'?'பொருத்தமான வழிகாட்டி இல்லை. வேறு சொற்களில் முயற்சிக்கவும். உடனடி ஆபத்தில் 112-ஐ அழைக்கவும்.':'I could not match that question to a guide yet. Try phone, money, documents, laptop, exam, travel or emergency. If someone is in immediate danger in India, call 112.'}out.classList.add('show')}
$('ask-submit').onclick=findGuide;$('question').onkeydown=e=>{if(e.key==='Enter')findGuide()};
$('voice-btn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('answer').textContent=lang==='ta'?'இந்த உலாவியில் குரல் உள்ளீடு ஆதரிக்கப்படவில்லை. தட்டச்சு செய்யவும்.':'Voice input is not supported in this browser. Please type your question.';$('answer').classList.add('show');return}const r=new SR();r.lang=lang==='ta'?'ta-IN':'en-IN';r.onresult=e=>$('question').value=e.results[0][0].transcript;r.onerror=()=>{$('answer').textContent='Voice input failed. Please type your question.';$('answer').classList.add('show')};r.start()};
render();
</script></body></html>
